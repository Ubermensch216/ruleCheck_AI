services:
  grc-reviewer:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:e2b
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
